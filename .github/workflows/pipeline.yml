name: Retail Inventory Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t retail-inventory-analytics .

      - name: Run pipeline and tests
        run: docker run --rm retail-inventory-analytics
